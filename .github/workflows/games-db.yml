# Rebuilds the optional games database (games.json.zip on the db branch) from
# the owner's public CHGame releases: daily, and on demand from the Actions tab.
name: games database

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: db
          path: db
      - name: Build games.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 main/tools/make_games_db.py --out db --previous db/games.json
      - name: Push if changed
        working-directory: db
        run: |
          git add games.json games.json.zip
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the games database"
          git push
